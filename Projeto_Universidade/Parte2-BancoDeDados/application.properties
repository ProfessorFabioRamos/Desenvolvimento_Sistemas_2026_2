spring.application.name=PrimeiraAPI

# URL da conexão do banco H2
spring.datasource.url = jdbc:h2:mem:universidadedb
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =

# Ativar o console web do H2 (para ver as tabelas no navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Mostrar o SQL gerado no terminal
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.open-in-view=false
